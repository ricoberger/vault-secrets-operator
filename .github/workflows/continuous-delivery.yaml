---
name: Continuous Delivery

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Docker Metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{raw}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  helm:
    name: Helm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/vault-secrets-operator

      - name: Template Helm Chart
        run: |
          helm template ./charts/vault-secrets-operator

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Set Version
        id: version
        run: |
          echo version=$(yq -r .version ./charts/vault-secrets-operator/Chart.yaml) >> $GITHUB_OUTPUT

      - name: Check if Version is Already Published
        id: check
        run: |
          if helm show chart oci://ghcr.io/${{ github.repository_owner }}/charts/vault-secrets-operator --version ${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "Chart version ${{ steps.version.outputs.version }} is already published, skipping"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "Chart version ${{ steps.version.outputs.version }} is not published yet"
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Package and Push Helm Chart
        if: steps.check.outputs.publish == 'true'
        run: |
          helm package ./charts/vault-secrets-operator --version ${{ steps.version.outputs.version }}
          helm push ./vault-secrets-operator-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
